<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="navbar">

    <div class="navbar">

        <div class="logo">

            <img th:src="@{/images/logo-app.png}" alt="Logo" class="logo-img">

            <span>Random Experience</span>

        </div>

        <div class="nav-links">

            <a href="/home">Home</a>
            <a href="/recommendations/all">Activities</a>

            <a th:if="${session.user != null}" href="/favorites">Favorites</a>
            <a th:if="${session.user != null}" href="/recommendations/recommended">For You</a>
            <a th:if="${session.user != null}" href="/recommendations/new">Add</a>

        </div>

        <div class="nav-auth">

            <div class="auth-group">

                <a th:if="${session.user == null}" href="/login" class="auth-btn login-btn">Login</a>
                <a th:if="${session.user == null}" href="/register" class="auth-btn register-btn">Register</a>

                <a th:if="${session.user != null}" href="/logout" class="auth-btn logout-btn">Logout</a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
