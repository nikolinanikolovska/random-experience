<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- CONTENT -->
<div class="container auth-page">

    <div class="auth-card">

        <!-- HEADER -->
        <div class="hero auth-hero">

            <h1>Welcome Back 👋</h1>

            <p>
                Sign in to continue exploring your favorite
                experiences and personalized recommendations.
            </p>

        </div>

        <!-- FORM -->
        <form method="post"
              action="/login"
              class="auth-form">

            <label>Username</label>

            <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
            >

            <label>Password</label>

            <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
            >

            <!-- ERROR -->
            <p th:if="${error}"
               th:text="${error}"
               class="error-text">
            </p>

            <!-- BUTTON -->
            <button type="submit"
                    class="primary-btn auth-submit-btn">

                🔐 Login

            </button>

        </form>

        <!-- FOOTER -->
        <div class="auth-footer">

            <p>
                Don't have an account?
            </p>

            <a href="/register"
               class="primary-link-btn">

                ✨ Create Account

            </a>

        </div>

    </div>

</div>

</body>
</html>
